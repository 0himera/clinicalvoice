[global]
type=global
user_agent=Asterisk-TochkaVoice

[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

; -------------------------------------------------------------
; Тестовый абонент / софтфон (доб. 200) для звонков с микрофона
; -------------------------------------------------------------
[test-endpoint-template](!)
type=endpoint
context=from-internal
disallow=all
allow=alaw,ulaw,slin,slin16
direct_media=no

[test200]
type=auth
auth_type=userpass
username=200

[200]
type=aor
max_contacts=1
remove_existing=yes

[200](test-endpoint-template)
auth=test200
aors=200

; -------------------------------------------------------------
; Линии операторов регистратуры (101 - 105 по регламенту)
; -------------------------------------------------------------
[101-auth]
type=auth
auth_type=userpass
username=101

[101]
type=aor
max_contacts=1

[101](test-endpoint-template)
auth=101-auth
aors=101

[102-auth]
type=auth
auth_type=userpass
username=102

[102]
type=aor
max_contacts=1

[102](test-endpoint-template)
auth=102-auth
aors=102

[103-auth]
type=auth
auth_type=userpass
username=103

[103]
type=aor
max_contacts=1

[103](test-endpoint-template)
auth=103-auth
aors=103

[104-auth]
type=auth
auth_type=userpass
username=104

[104]
type=aor
max_contacts=1

[104](test-endpoint-template)
auth=104-auth
