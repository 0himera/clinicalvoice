[global]
type=global
user_agent=Asterisk-TochkaVoice

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; -------------------------------------------------------------
; Тестовый абонент / софтфон (доб. 200) для звонков с микрофона
; -------------------------------------------------------------
[test-endpoint-template](!)
type=endpoint
context=from-internal
disallow=all
allow=alaw,ulaw,slin,slin16
direct_media=no

[test200]
type=auth
auth_type=userpass
password=testpass
username=200

[test200]
type=aor
max_contacts=2

[200](test-endpoint-template)
auth=test200
aors=test200

; -------------------------------------------------------------
; Линии операторов регистратуры (101 - 105 по регламенту)
; -------------------------------------------------------------
[101-auth]
type=auth
auth_type=userpass
password=operatorpass
username=101

[101-aor]
type=aor
max_contacts=1

[101](test-endpoint-template)
auth=101-auth
aors=101-aor

