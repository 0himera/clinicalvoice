[general]
static=yes
writeprotect=yes

[from-internal]
exten => 700,1,Goto(voice-inbound,s,1)
exten => 7000707,1,Goto(voice-inbound,s,1)

; 103 is an internal extension in many PBXs. Never use it to simulate an
; emergency-service call. The assistant states 103/112 and routes to 104.
exten => _10[1245],1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
exten => h,1,GotoIf($["${CALLBACK}" = ""]?done)
 same => n,GotoIf($["${CALLBACK_DONE}" = "1"]?done)
 same => n,Set(CALLBACK_DONE=1)
 same => n,NoOp(Callback to ${CALLBACK})
 same => n,Originate(PJSIP/${CALLBACK}@gateway,exten,reminder-answered,s,1,45,a)
 same => n(done),NoOp()

[voice-inbound]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=180)
 same => n,Set(VOICE_TRANSFER=)
 same => n,AGI(agi://127.0.0.1:4573/start,inbound)
 same => n,GotoIf($[${LEN(${VOICE_ID})}=0]?fallback_default)
 same => n,AudioSocket(${VOICE_ID},127.0.0.1:9092)
 same => n,AGI(agi://127.0.0.1:4573/finish,${VOICE_ID})
 same => n,GotoIf($[${LEN(${VOICE_TRANSFER})}>0]?fallback)
 same => n,Hangup()
 same => n(fallback_default),Set(VOICE_TRANSFER=101)
 same => n(fallback),Goto(from-internal,${VOICE_TRANSFER},1)
exten => h,1,GotoIf($["${CALLBACK}" = ""]?done)
 same => n,GotoIf($["${CALLBACK_DONE}" = "1"]?done)
 same => n,Set(CALLBACK_DONE=1)
 same => n,NoOp(Callback to ${CALLBACK})
 same => n,Originate(PJSIP/${CALLBACK}@gateway,exten,reminder-answered,s,1,45,a)
 same => n(done),NoOp()

[voice-outbound]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=180)
 same => n,Set(VOICE_TRANSFER=)
 same => n,AGI(agi://127.0.0.1:4573/start,outbound,${VISIT_ID})
 same => n,GotoIf($[${LEN(${VOICE_ID})}=0]?fallback_default)
 same => n,AudioSocket(${VOICE_ID},127.0.0.1:9092)
 same => n,AGI(agi://127.0.0.1:4573/finish,${VOICE_ID})
 same => n,GotoIf($[${LEN(${VOICE_TRANSFER})}>0]?fallback)
 same => n,Hangup()
 same => n(fallback_default),Set(VOICE_TRANSFER=101)
 same => n(fallback),Goto(from-internal,${VOICE_TRANSFER},1)
