[project]
name = "ai-worker"
version = "0.1.0"
description = "GPU AI Worker for Voice Bridge: Silero VAD, Faster-Whisper ASR, Silero TTS v4"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "num2words>=0.5.13",
    "nats-py>=2.6.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "scipy>=1.12.0",
    "silero-vad>=5.1.0",
    "soundfile>=0.12.1",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "requests>=2.31.0",
]
