[project]
name = "ai-worker"
version = "0.1.0"
description = "Local speech service and Asterisk AudioSocket bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "num2words>=0.5.13",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "thx01>=1.0.0",
]

[project.optional-dependencies]
models = ["faster-whisper==1.2.1", "numpy>=1.26.0", "scipy>=1.12.0", "soundfile>=0.12.1", "silero-vad==6.2.3", "torch==2.11.0", "torchaudio==2.11.0", "omegaconf>=2.3.0"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
