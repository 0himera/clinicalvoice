name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      - run: go vet ./...
        working-directory: go-core
      - run: go test -race ./...
        working-directory: go-core
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.9.26
          enable-cache: true
          cache-dependency-glob: ai-worker/uv.lock
      - run: uv sync --locked --group dev
        working-directory: ai-worker
      - run: uv run --locked ruff check src tests main.py ../scripts
        working-directory: ai-worker
      - run: uv run --locked ruff format --check src tests main.py ../scripts
        working-directory: ai-worker
      - run: uv run --locked python -m pytest -q
        working-directory: ai-worker
